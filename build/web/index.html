  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #0A1628;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.getElementById("mobile-app-banner")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>

<body>
  <!-- Mobile App Promo Banner (Visible immediately during slow load) -->
  <div id="mobile-app-banner" style="
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 460px;
    background: rgba(30, 41, 59, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
    border-radius: 16px;
    padding: 16px;
    z-index: 99999;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 12px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #f8fafc;
    backdrop-filter: blur(12px);
    transition: all 0.3s ease;
  ">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%;">
      <div style="display: flex; gap: 12px; align-items: center;">
        <img src="favicon.png" style="width: 40px; height: 40px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.2);" />
        <div>
          <h4 style="margin: 0; font-size: 14px; font-weight: 700; color: #fff;">Get the Home237 App</h4>
          <p style="margin: 2px 0 0 0; font-size: 11px; color: #94a3b8; line-height: 1.4;">For a faster, smoother, and data-friendly experience.</p>
        </div>
      </div>
      <button onclick="document.getElementById('mobile-app-banner').style.display = 'none'" style="
        background: transparent;
        border: none;
        color: #94a3b8;
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
        padding: 4px;
        margin-top: -4px;
        transition: color 0.2s;
      " onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#94a3b8'">×</button>
    </div>
    <div style="display: flex; gap: 10px; width: 100%;">
      <a href="app-release.apk" style="
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: #3b82f6;
        color: #fff;
        text-decoration: none;
        font-size: 12px;
        font-weight: 600;
        padding: 9px 12px;
        border-radius: 8px;
        text-align: center;
        transition: background-color 0.2s;
      " onmouseover="this.style.backgroundColor='#2563eb'" onmouseout="this.style.backgroundColor='#3b82f6'">
        <svg style="width: 12px; height: 12px; fill: currentColor;" viewBox="0 0 24 24"><path d="M17.5 1h-11C5.12 1 4 2.12 4 3.5v17C4 21.88 5.12 23 6.5 23h11c1.38 0 2.5-1.12 2.5-2.5v-17C20 2.12 18.88 1 17.5 1zm-11 2h11c.28 0 .5.22.5.5V18H6V3.5c0-.28.22-.5.5-.5zM12 21c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
        Download Android APK
      </a>
    </div>
  </div>

  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  
  <script src="flutter_bootstrap.js" async=""></script>
</body></html>
